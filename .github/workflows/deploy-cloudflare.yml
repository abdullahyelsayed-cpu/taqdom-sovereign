name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I understand this deploys the current main branch to the live Taqdom Worker."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: taqdom-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_production == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before deploying."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret before deploying."
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies, type-check, and run quality guards
        run: |
          pnpm audit --audit-level=high
          pnpm typecheck
          node --check cloudflare/worker.mjs
          node --check cloudflare/mcp.mjs
          node scripts/quality-guards.mjs
          node scripts/verify-mcp.mjs
          node --check scripts/verify-taqdom.mjs
          node --check scripts/e2e-browser.mjs

      - name: Build production app
        run: pnpm build

      - name: Package Cloudflare assets
        run: pnpm build:cloudflare

      - name: Run local end-to-end API and publishing verification
        env:
          AUTH_SECRET: "taqdom-ci-only-not-a-production-secret-00000000000000000000"
          PORT: "3040"
          BASE_URL: "http://localhost:3040"
        shell: bash
        run: |
          pnpm exec next start --hostname 127.0.0.1 --port 3040 > /tmp/taqdom-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3040/api/auth/me >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:3040/api/auth/me >/dev/null; then
            cat /tmp/taqdom-next.log
            exit 1
          fi
          node scripts/verify-taqdom.mjs

      - name: Verify session signing secret is already configured
        shell: bash
        run: |
          SECRET_LIST="$(pnpm dlx wrangler@latest secret list --config wrangler.jsonc)"
          printf '%s' "$SECRET_LIST" | grep -q 'AUTH_SECRET' || {
            echo "::error::AUTH_SECRET is missing from the Cloudflare Worker."
            echo "Set it once with: pnpm dlx wrangler@latest secret put AUTH_SECRET"
            echo "Do not store the secret value in this repository."
            exit 1
          }

      - name: Deploy Taqdom Worker and assets
        run: pnpm dlx wrangler@latest deploy --config wrangler.jsonc

      - name: Verify live homepage, founder credit, portrait, and portfolio subdomain
        shell: bash
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"
          HOME_HTML="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors -A "$UA" https://taqdom.me/)"
          printf '%s' "$HOME_HTML" | grep -q 'عبدالله يحى'
          printf '%s' "$HOME_HTML" | grep -q 'linkedin.com/in/abdullah-yehia/'
          printf '%s' "$HOME_HTML" | grep -q 'مبادرة سفراء الذكاء الاصطناعي'
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors -A "$UA" -o /dev/null https://taqdom.me/images/abdullah-yehia.webp
          PROFILE_HTML="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors -A "$UA" https://layla.taqdom.me/)"
          printf '%s' "$PROFILE_HTML" | grep -q 'ProfilePage'
